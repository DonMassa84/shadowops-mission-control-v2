name: ShadowOps Production Gate

on:
  push:
    branches:
      - main
      - hardening/production-ready-2026-08-25
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadowops-production-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  SHADOWOPS_START_PERSISTENCE: "false"

jobs:
  quality:
    name: Build, test and production gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - name: Restore Mix cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp27-elixir1.17-mix-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp27-elixir1.17-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Verify dependency lock
        run: git diff --exit-code -- mix.lock

      - name: Install Sobelow 0.15.0
        run: mix archive.install hex sobelow 0.15.0 --force

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors

      - name: Run full test suite
        run: mix test --seed 12345

      - name: Verify Layer Health routes and read-only contract
        shell: bash
        run: |
          set -euo pipefail
          mix phx.routes > /tmp/shadowops-routes.txt
          grep -F '/layers' /tmp/shadowops-routes.txt
          grep -F '/api/layers' /tmp/shadowops-routes.txt
          if grep -E 'POST[[:space:]]+/api/layers([[:space:]/]|$)' /tmp/shadowops-routes.txt; then
            echo 'Layer API mutation route detected' >&2
            exit 1
          fi

      - name: Validate workflow registry
        run: mix shadowops.registry validate

      - name: Validate workflow IDs
        run: mix shadowops.workflow_ids.validate

      - name: Audit Hex dependencies
        run: mix hex.audit

      - name: Check whitespace
        run: git diff --check

      - name: Run static production acceptance
        env:
          SHADOWOPS_RUNTIME_REQUIRED: "0"
        run: bash scripts/production_acceptance.sh

      - name: Build production release
        env:
          MIX_ENV: prod
        run: mix release shadowops --overwrite

      - name: Start release and run production smoke
        shell: bash
        env:
          MIX_ENV: prod
          PORT: "4013"
          SHADOWOPS_START_PERSISTENCE: "false"
        run: |
          set -Eeuo pipefail
          export SHADOWOPS_SECRET_KEY_BASE="$(openssl rand -hex 64)"
          export SHADOWOPS_READ_TOKEN="$(openssl rand -hex 32)"
          export SHADOWOPS_WRITE_TOKEN="$(openssl rand -hex 32)"
          export SHADOWOPS_STATE_DIR="$RUNNER_TEMP/shadowops-state"
          mkdir -p "$SHADOWOPS_STATE_DIR"

          cleanup() {
            timeout 10s _build/prod/rel/shadowops/bin/shadowops stop >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          _build/prod/rel/shadowops/bin/shadowops start

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 \
              -H "Authorization: Bearer $SHADOWOPS_READ_TOKEN" \
              http://127.0.0.1:4013/health >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo 'Production release did not become healthy' >&2
            _build/prod/rel/shadowops/bin/shadowops rpc 'IO.inspect(:init.get_status())' || true
            exit 1
          fi

          timeout 180s env \
            SHADOWOPS_BASE_URL=http://127.0.0.1:4013 \
            SHADOWOPS_READ_TOKEN="$SHADOWOPS_READ_TOKEN" \
            bash scripts/runtime_smoke.sh
