name: One-time Mix Format

on:
  push:
    branches:
      - hardening/production-ready-2026-08-25
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'style: apply mix format') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/production-ready-2026-08-25

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17.3"
          otp-version: "27.3"

      - run: mix deps.get
      - run: mix format

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "FORMAT_ALREADY_CLEAN=YES"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply mix format"
          git push origin HEAD:hardening/production-ready-2026-08-25
