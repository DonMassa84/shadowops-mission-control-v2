name: WhatsApp operations verification

on:
  push:
    branches: ["feat/whatsapp-operations-20260928"]
  pull_request:
    paths:
      - "apps/shadowops_web/lib/shadow_ops_web/live/social_unavailable_live.ex"
      - "apps/shadowops_web/test/whatsapp_operations_ui_test.exs"
      - ".github/workflows/whatsapp-operations.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MIX_ENV: test
      SHADOWOPS_START_PERSISTENCE: "false"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.17.3"
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: whatsapp-${{ runner.os }}-${{ hashFiles('mix.lock') }}
      - run: mix deps.get
      - run: git diff --exit-code -- mix.lock
      - run: mix compile --warnings-as-errors
      - name: WhatsApp behavior tests
        run: mix test apps/shadowops_web/test/whatsapp_operations_ui_test.exs
      - name: Full regression suite
        run: mix test --seed 12345
      - name: Changed file format
        run: mix format --check-formatted apps/shadowops_web/lib/shadow_ops_web/live/social_unavailable_live.ex apps/shadowops_web/test/whatsapp_operations_ui_test.exs
