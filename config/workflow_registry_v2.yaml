schema_version: 2
registry_name: shadowops-workflows
status: migration_candidate

compatibility:
  legacy_registry: config/workflow_registry.yaml
  cutover_policy: keep_v1_until_elixir_loader_and_gates_validate_v2
  source_of_truth_during_migration: dual_registry

workflows:
  finanzabgleich:
    type: business
    domain: finance
    status: active
    current_runtime: agent_chain_legacy
    target_runtime: elixir
    always_run: true
    documentation: docs/finanzen/WORKFLOW-Finanzabgleich.md
    agent_rules: docs/finanzen/AGENTS.md
    master: docs/finanzen/Soll-Ist-Abgleich_VfB-AFBG-KfW-IHK-Jobcenter.md
    orchestrator: config/agents/finanzen/finanzabgleich_orchestrator.yaml
    agents:
      - id: finanz_quellen_agent
        path: config/agents/finanzen/finanz_quellen_agent.yaml
        order: 10
        required: true
      - id: finanz_zahlungsketten_agent
        path: config/agents/finanzen/finanz_zahlungsketten_agent.yaml
        order: 20
        required: true
      - id: finanz_foerderkontroll_agent
        path: config/agents/finanzen/finanz_foerderkontroll_agent.yaml
        order: 30
        required: true
      - id: finanz_master_sync_agent
        path: config/agents/finanzen/finanz_master_sync_agent.yaml
        order: 40
        required: true
    internal_statuses:
      - BELEGT
      - RECHNERISCH
      - OFFEN
      - WIDERSPRUCH
    quality_gates:
      - finance_quality_gate
    migration_priority: 1

  career_email_only:
    type: business
    domain: career
    status: active_definition
    current_runtime: yaml_pipeline_legacy
    target_runtime: elixir
    definition: config/career_email_only_workflow.yaml
    pipeline:
      - DISCOVER
      - VERIFY_EMAIL
      - DEDUPE_ADDRESS
      - DEDUPE_COMPANY
      - FIT_CHECK
      - COMPANY_RESEARCH
      - CUSTOMIZE_COVER_LETTER
      - CUSTOMIZE_CV
      - SELECT_EVIDENCE
      - PDF_QA
      - SEND_EMAIL
      - VERIFY_SENT
      - WRITE_GITHUB_REPORT
      - WRITE_OBSIDIAN_NOTE
      - FOLLOW_UP
    external_side_effects:
      - SEND_EMAIL
    approval_policy: to_define_for_product_runtime
    migration_priority: 2

  document_ai:
    type: business
    domain: documents
    status: extraction_candidate
    current_runtime: python
    target_runtime: hybrid
    worker_runtime: python
    orchestration_target: elixir
    source_components:
      - app/ihk_ai.py
      - app/cli.py
    registry_definition_status: planned
    migration_priority: 3

  repository_quality:
    type: system
    domain: ci
    status: active
    runtime: github_actions
    definition: .github/workflows/quality.yml
    responsibility:
      - python_install
      - syntax
      - tests
      - repository_hygiene
      - secret_guard
      - quality_gate

  finance_quality_gate:
    type: system
    domain: ci
    status: active
    runtime: github_actions
    definition: .github/workflows/finanzabgleich-gate.yml
    responsibility:
      - finance_required_files
      - legacy_registry_validation
      - finance_agent_chain
      - finance_master_structure
      - privacy_gate

  agent_state_sync:
    type: system
    domain: system
    status: VERIFIED_EXECUTABLE
    runtime: /usr/bin/flock
    argv:
      - "-n"
      - /home/schattenmacher/.local/state/agent-state-hub/sync.lock
      - /home/schattenmacher/DokumentenSystem/08_KONFIGRATION/bin/agent-state-sync
    definition: /home/schattenmacher/.config/systemd/user/agent-state-sync.service

  career_funnel_ihk:
    type: business
    domain: career
    status: DISABLED_BY_CONFIGURATION
    optional: true
    configuration_status: NOT_CONFIGURED
    runtime: /home/schattenmacher/.local/bin/career-funnel
    definition: /home/schattenmacher/.config/systemd/user/career-funnel-ihk.service
    disabled_reason: configured IHK project directory is not present

  daily_digest:
    type: system
    domain: reporting
    status: VERIFIED_EXECUTABLE
    runtime: /home/schattenmacher/DokumentenSystem/07_AUTOMATION/daily_digest.sh
    argv: []
    definition: /home/schattenmacher/.config/systemd/user/daily-digest.service

  shadow_system_overnight_audit:
    type: system
    domain: security
    status: VERIFIED_EXECUTABLE
    runtime: /home/schattenmacher/03_scripts/system_overnight_audit.sh
    argv: []
    definition: /home/schattenmacher/.config/systemd/user/shadow-system-overnight-audit.service

