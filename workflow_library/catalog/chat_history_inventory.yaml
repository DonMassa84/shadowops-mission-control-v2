migration_notes:
  - This is a first persistent migration pass assembled from the available ShadowOps conversation history plus current GitHub evidence.
  - Entries are intentionally non-executable until normalized and validated against the real capability and executor registries.
  - Historical aliases and variants should be preserved as provenance, then deduplicated into canonical families rather than silently deleted.
  - The next pass must reconcile this catalog with config/workflow_registry_v2.yaml, external workflow evidence, GitHub Actions, and runtime discovery.
